name: Windows CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure
        shell: pwsh
        run: |
          $versionArgs = @()
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v?(\d+\.\d+\.\d+)$') {
              throw "Tag '$tag' is not a semantic version tag like v2.0.7."
            }
            $versionArgs += "-DSHUTDOWN_VERSION_OVERRIDE=$($Matches[1])"
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}" @versionArgs

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $package = Join-Path $pwd "package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item (Join-Path $pwd "build/Release/ShutDown.exe") (Join-Path $package "ShutDown.exe") -Force
          Copy-Item (Join-Path $pwd "third_party/win32xx/license.txt") (Join-Path $package "Win32xx-MIT.txt") -Force
          $archive = Join-Path $pwd "ShutDown-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive -Force

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ShutDown-windows-${{ matrix.arch }}
          path: |
            package/
            ShutDown-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish Windows ZIP release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download architecture artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ShutDown-windows-*
          merge-multiple: true
          path: release

      - name: Verify release notes
        shell: pwsh
        run: |
          $notes = Join-Path $pwd "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            throw "缺少 $notes。请先写好本版本的具体更新说明，避免 Release 显示空泛描述。"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: false
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            release/ShutDown-windows-x64.zip
            release/ShutDown-windows-x86.zip
