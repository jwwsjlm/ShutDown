name: Windows CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "5.15.2"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          dir: "${{ github.workspace }}/Qt"
          cache: true
          set-env: true

      - name: Configure
        shell: pwsh
        run: |
          if (-not $env:QT_ROOT_DIR) {
            throw "QT_ROOT_DIR was not provided by install-qt-action"
          }
          Write-Host "Qt root: $env:QT_ROOT_DIR"
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          $env:PATH = "$qtBin;$env:PATH"
          $testExe = Join-Path $pwd "build/tests/Release/ShutDownTests.exe"
          Write-Host "Qt bin: $qtBin"
          Write-Host "Test executable: $testExe"
          if (-not (Test-Path $testExe)) { throw "Test executable not found" }
          & $testExe -v2
          if ($LASTEXITCODE -ne 0) { throw "Direct test execution failed with exit code $LASTEXITCODE" }
          ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Package Windows application
        shell: pwsh
        run: |
          $package = Join-Path $pwd "package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          $exe = Join-Path $pwd "build/Release/ShutDown.exe"
          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release `
            --no-translations `
            --compiler-runtime `
            --dir $package `
            $exe
          Copy-Item $exe (Join-Path $package "ShutDown.exe") -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ShutDown-windows-x64
          path: package/
          if-no-files-found: error

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath ShutDown-windows-x64.zip -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: ShutDown-windows-x64.zip
