name: Windows build and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Configure
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $versionArgs = @("-DSHUTDOWN_VERSION_OVERRIDE=")
          if ($env:REF_TYPE -eq "tag") {
            $tag = $env:TAG_NAME
            if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Tag '$tag' must look like v2.1.4."
            }
            $versionArgs = @("-DSHUTDOWN_VERSION_OVERRIDE=$($Matches[1])")
          }
          cmake --preset "windows-$env:ARCH" @versionArgs

      - name: Build
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: cmake --build --preset "windows-$env:ARCH-release" --parallel

      - name: Test
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: ctest --preset "windows-$env:ARCH-release"

      - name: Package portable app
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $package = Join-Path $pwd "package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item (Join-Path $pwd "build/windows-$env:ARCH/Release/ShutDown.exe") (Join-Path $package "ShutDown.exe") -Force
          Copy-Item (Join-Path $pwd "third_party/win32xx/license.txt") (Join-Path $package "Win32xx-MIT.txt") -Force
          Compress-Archive `
            -Path (Join-Path $package "*") `
            -DestinationPath (Join-Path $pwd "ShutDown-win-$env:ARCH-Portable.zip") `
            -Force

      - name: Upload portable package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ShutDown-win-${{ matrix.arch }}-Portable
          path: ShutDown-win-${{ matrix.arch }}-Portable.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download portable packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ShutDown-win-*-Portable
          path: release
          merge-multiple: true

      - name: Render release notes
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' must look like v2.1.4."
          }
          $version = $Matches[1]
          $notes = Join-Path $pwd "release-notes/$tag.md"
          if (-not (Test-Path $notes)) {
            throw "缺少 $notes。请先写好本版本的具体更新说明，避免 Release 显示空泛描述。"
          }
          New-Item -ItemType Directory -Path (Join-Path $pwd "release") -Force | Out-Null
          $body = Get-Content -LiteralPath $notes -Raw
          $body = $body.Replace('vX.Y.Z', $tag).Replace('<version>', $version)
          Set-Content -LiteralPath (Join-Path $pwd "release/generated-notes.md") -Value $body -NoNewline -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: false
          body_path: release/generated-notes.md
          fail_on_unmatched_files: true
          files: |
            release/ShutDown-win-x64-Portable.zip
            release/ShutDown-win-x86-Portable.zip
