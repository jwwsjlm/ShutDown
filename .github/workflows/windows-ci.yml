name: Windows CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $package = Join-Path $pwd "package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item (Join-Path $pwd "build/Release/ShutDown.exe") (Join-Path $package "ShutDown.exe") -Force
          Copy-Item (Join-Path $pwd "third_party/win32xx/license.txt") (Join-Path $package "Win32xx-MIT.txt") -Force
          $archive = Join-Path $pwd "ShutDown-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive -Force

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShutDown-windows-${{ matrix.arch }}
          path: |
            package/
            ShutDown-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish Windows ZIP release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ShutDown-windows-*
          merge-multiple: true
          path: release

      - name: Prepare release notes
        shell: pwsh
        run: |
          $notes = Join-Path $pwd "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            New-Item -ItemType Directory -Path (Split-Path $notes) -Force | Out-Null
            @"
          ## ShutDown ${{ github.ref_name }}

          本版本包含最新的 Windows x86/x64 构建。详细改动请参阅仓库提交记录。

          ### 发布文件

          - `ShutDown-windows-x64.zip`
          - `ShutDown-windows-x86.zip`
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            release/ShutDown-windows-x64.zip
            release/ShutDown-windows-x86.zip
