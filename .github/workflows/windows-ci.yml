name: Windows CI

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Configure
        shell: pwsh
        run: |
          $versionArgs = @()
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v?(\d+\.\d+\.\d+)$') {
              throw "Tag '$tag' is not a semantic version tag like v2.0.7."
            }
            $versionArgs += "-DSHUTDOWN_VERSION_OVERRIDE=$($Matches[1])"
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}" @versionArgs

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Stage app
        shell: pwsh
        run: |
          $package = Join-Path $pwd "app-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          $exe = Join-Path $pwd "build/Release/ShutDown.exe"
          Copy-Item $exe (Join-Path $package "ShutDown.exe") -Force
          Copy-Item (Join-Path $pwd "third_party/win32xx/license.txt") (Join-Path $package "Win32xx-MIT.txt") -Force

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ShutDown-app-${{ matrix.arch }}
          path: |
            app-${{ matrix.arch }}/
          if-no-files-found: error

  release:
    name: Publish Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download x64 artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ShutDown-app-x64
          path: release/app-x64

      - name: Download x86 artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ShutDown-app-x86
          path: release/app-x86

      - name: Render release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v?(\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' is not a semantic version tag like v2.1.4."
          }
          $version = $Matches[1]
          $notes = Join-Path $pwd "release-notes/$tag.md"
          if (-not (Test-Path $notes)) {
            throw "缺少 $notes。请先写好本版本的具体更新说明，避免 Release 显示空泛描述。"
          }
          New-Item -ItemType Directory -Path (Join-Path $pwd "release") -Force | Out-Null
          $body = Get-Content -LiteralPath $notes -Raw
          $body = $body.Replace('vX.Y.Z', $tag).Replace('<version>', $version)
          Set-Content -LiteralPath (Join-Path $pwd "release/generated-notes.md") -Value $body -NoNewline -Encoding UTF8

      - name: Build portable packages
        shell: pwsh
        run: |
          $out = Join-Path $pwd "release"
          Compress-Archive -Path (Join-Path $pwd "release/app-x64/*") -DestinationPath (Join-Path $out "ShutDown-win-x64-Portable.zip") -Force
          Compress-Archive -Path (Join-Path $pwd "release/app-x86/*") -DestinationPath (Join-Path $out "ShutDown-win-x86-Portable.zip") -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: false
          body_path: release/generated-notes.md
          files: |
            release/ShutDown-win-x64-Portable.zip
            release/ShutDown-win-x86-Portable.zip
