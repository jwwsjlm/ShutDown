name: Windows CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2019_64
            cmake_arch: x64
          - arch: x86
            qt_arch: win32_msvc2019
            cmake_arch: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "5.15.2"
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          dir: "${{ github.workspace }}/Qt"
          cache: true
          set-env: true

      - name: Configure
        shell: pwsh
        run: |
          if (-not $env:QT_ROOT_DIR) { throw "QT_ROOT_DIR was not provided" }
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A "${{ matrix.cmake_arch }}" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          $env:PATH = "$qtBin;$env:PATH"
          $testExe = Join-Path $pwd "build/tests/Release/ShutDownTests.exe"
          $updateTestExe = Join-Path $pwd "build/tests/Release/ShutDownUpdateTests.exe"
          if (-not (Test-Path $testExe)) { throw "Test executable not found: $testExe" }
          if (-not (Test-Path $updateTestExe)) { throw "Update test executable not found: $updateTestExe" }
          & $testExe
          if ($LASTEXITCODE -ne 0) { throw "Scheduler test failed" }
          & $updateTestExe
          if ($LASTEXITCODE -ne 0) { throw "Update manager test failed" }
          ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $package = Join-Path $pwd "package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          $exe = Join-Path $pwd "build/Release/ShutDown.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          # windeployqt copies runtime dependencies but does not copy the
          # application binary itself when --dir is used.  Copy it explicitly
          # so the ZIP is runnable after extraction.
          Copy-Item -LiteralPath $exe -Destination (Join-Path $package "ShutDown.exe") -Force
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release `
            --no-translations `
            --compiler-runtime `
            --dir $package `
            $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          # Qt 5.15 loads the OpenSSL 1.1 backend at runtime.  Download the
          # matching x86/x64 DLLs from the pinned NuGet package and place them
          # beside ShutDown.exe.  The package contains both architectures.
          $nuget = Join-Path $env:RUNNER_TEMP "zeroc.openssl.v142.1.1.3.nupkg"
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/zeroc.openssl.v142/1.1.1.3" `
            -OutFile $nuget
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $nuget).Hash
          if ($hash -ne "98434B80BBCC0D60A1184D11D310F1C37D7BEB57F9B6FD6A84AB99F090305FBE") {
            throw "OpenSSL package SHA-256 mismatch: $hash"
          }
          $opensslRoot = Join-Path $env:RUNNER_TEMP "openssl-v142"
          Expand-Archive -LiteralPath $nuget -DestinationPath $opensslRoot -Force
          $opensslArch = if ("${{ matrix.arch }}" -eq "x64") { "x64" } else { "Win32" }
          $opensslBin = Join-Path $opensslRoot "build/native/bin/$opensslArch/Release"
          $opensslNames = if ("${{ matrix.arch }}" -eq "x64") {
            @("libcrypto-1_1-x64.dll", "libssl-1_1-x64.dll")
          } else {
            @("libcrypto-1_1.dll", "libssl-1_1.dll")
          }
          foreach ($name in $opensslNames) {
            $source = Join-Path $opensslBin $name
            if (-not (Test-Path $source)) { throw "OpenSSL runtime DLL not found: $source" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $package $name) -Force
          }
          Copy-Item (Join-Path $pwd "licenses/Qt-LGPL.md") (Join-Path $package "Qt-LGPL.md") -Force
          Copy-Item (Join-Path $pwd "licenses/OpenSSL-LICENSE.txt") (Join-Path $package "OpenSSL-LICENSE.txt") -Force
          $archive = Join-Path $pwd "ShutDown-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive -Force

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ShutDown-windows-${{ matrix.arch }}
          path: |
            package/
            ShutDown-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish Windows ZIP release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ShutDown-windows-*
          merge-multiple: true
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: |
            release/ShutDown-windows-x64.zip
            release/ShutDown-windows-x86.zip
