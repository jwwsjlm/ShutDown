name: Windows CI

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download Velopack C SDK
        shell: pwsh
        run: |
          $root = Join-Path $pwd "build/velopack"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          gh release download 1.2.0 --repo velopack/velopack --pattern velopack_libc_1.2.0.zip --dir $root --clobber
          Expand-Archive -LiteralPath (Join-Path $root "velopack_libc_1.2.0.zip") -DestinationPath $root -Force
          "VELOPACK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          $versionArgs = @()
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v?(\d+\.\d+\.\d+)$') {
              throw "Tag '$tag' is not a semantic version tag like v2.0.7."
            }
            $versionArgs += "-DSHUTDOWN_VERSION_OVERRIDE=$($Matches[1])"
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}" "-DVELOPACK_ROOT=$env:VELOPACK_ROOT" @versionArgs

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $package = Join-Path $pwd "app-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          $exe = Join-Path $pwd "build/Release/ShutDown.exe"
          Copy-Item $exe (Join-Path $package "ShutDown.exe") -Force
          Copy-Item (Join-Path $pwd "third_party/win32xx/license.txt") (Join-Path $package "Win32xx-MIT.txt") -Force
          Copy-Item $exe (Join-Path $pwd "ShutDown-windows-${{ matrix.arch }}.exe") -Force
          $archive = Join-Path $pwd "ShutDown-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive -Force

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ShutDown-windows-${{ matrix.arch }}
          path: |
            app-${{ matrix.arch }}/
            ShutDown-windows-${{ matrix.arch }}.exe
            ShutDown-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish Windows ZIP release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download architecture artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ShutDown-windows-*
          merge-multiple: true
          path: release

      - name: Verify release notes
        shell: pwsh
        run: |
          $notes = Join-Path $pwd "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            throw "缺少 $notes。请先写好本版本的具体更新说明，避免 Release 显示空泛描述。"
          }

      - name: Build Velopack packages
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $notes = Join-Path $pwd "release-notes/${{ github.ref_name }}.md"
          $out = Join-Path $pwd "release/velopack"
          dotnet tool install --tool-path .vpk vpk --version 1.2.0
          .\.vpk\vpk pack --packId ShutDown --packVersion $version --packDir release/app-x64 --mainExe ShutDown.exe --runtime win-x64 --channel win-x64 --outputDir $out --releaseNotes $notes --icon resources/app.ico --packTitle ShutDown --packAuthors ShutDown --yes --skip-updates
          .\.vpk\vpk pack --packId ShutDown --packVersion $version --packDir release/app-x86 --mainExe ShutDown.exe --runtime win-x86 --channel win-x86 --outputDir $out --releaseNotes $notes --icon resources/app.ico --packTitle ShutDown --packAuthors ShutDown --yes --skip-updates

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: false
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            release/ShutDown-windows-x64.exe
            release/ShutDown-windows-x86.exe
            release/ShutDown-windows-x64.zip
            release/ShutDown-windows-x86.zip
            release/velopack/*
